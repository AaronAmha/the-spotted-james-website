<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jobs | The Spotted James</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://thespottedjames.com/jobs/" />
<meta http-equiv="refresh" content="0; url=/jobs/" />
<script>
  // Moved to /jobs/. Old ?position= links go to that role's page.
  (function(){
    var map = { bartender: 'bartender', barback: 'barback', security: 'floor', door: 'floor', floor: 'floor', dj: 'dj', promo: 'promo', social: 'promo' };
    var p = '';
    try { p = (new URLSearchParams(location.search).get('position') || '').toLowerCase().split(/[^a-z]/)[0]; } catch (e) {}
    location.replace(map[p] ? '/jobs/' + map[p] + '.html' : '/jobs/');
  })();
</script>
</head>
<body><p><a href="/jobs/">Jobs at The Spotted James</a></p></body>
</html>
